<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Not Rude Training</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 0 24px; background: #121212; color: #f4f1ea; font: 16px/1.5 -apple-system, system-ui, sans-serif; text-align: center; }
    @media (prefers-color-scheme: light) { body { background: #f4f1ea; color: #121212; } }
  </style>
</head>
<body>
  <main>
    <h1 style="font-size:1.5rem">Not Rude Training</h1>
    <p>This build has no server address. Set NOTRUDE_APP_URL and run <code>npx cap sync ios</code>.</p>
  </main>
</body>
</html>
